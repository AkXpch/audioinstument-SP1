<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="./style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>

<body>
    <!-- make warning box before go in to main page-->
    <dialog id="intro-modal">
        <p>
        Noise Incoming!!!!
        </p>
        <button id="intro-modal-close">ok</button>
        
        
    </dialog>

    <header>
        <h1>Audio Instrument</h1>
    </header>

    <main>
    
        <button id="test-button" class="whitekey" data-note="C4">make sound</button>
        <button id="key-test" class="whitekey" data-note="D4">key</button>

        <!-- Bring in pre-render audio file-->
        <audio id="audio-track" src="./assets/p-hase_Leapt.mp3" controls></audio>

        <!--Create playback button to control audio playback-->
        <button id="playback-button">play</button>

        <!-- Random location on track button-->
        <button id="random-location">random</button>

        <!--image for spatial control -->
        <img src="https://cf.preview.redd.it/studio-ghibli-practice-v0-jt75gv88dcsb1.jpg?width=1080&crop=smart&auto=webp&s=75c57a29ade6c6e44d46058aeee7f5ae5d096205" 
        alt="a painting of green house" id="greenhouse-painting">
    </main>
    
    
</body>
</html>
